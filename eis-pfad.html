<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Eis-Pfad</title>

  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(25, 35, 45, 0.45), #000 70%),
        #000;
    }

    .setup {
      width: min(980px, calc(100vw - 32px));
      margin: 24px auto;
      background: #1d1d1d;
      border-radius: 28px;
      padding: 26px;
      box-shadow: 0 8px 0 #000;
      text-align: center;
    }

    .setup h1 {
      font-size: 4rem;
      margin: 0 0 10px;
    }

    .setup p {
      font-size: 1.4rem;
      color: #ddd;
      margin: 0 0 22px;
    }

    .topbar,
    .game-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .game-topbar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 50;
      pointer-events: none;
    }

    .game-topbar > * {
      pointer-events: auto;
    }

    .small-button {
      font-size: 1.05rem;
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      color: white;
      background: linear-gradient(#68c64a, #289313);
      box-shadow: 0 4px 0 #17640d;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
    }

    .small-button.orange {
      background: linear-gradient(#ff8a4b, #d94a18);
      box-shadow: 0 4px 0 #9c2e0c;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 22px 0;
    }

    .difficulty-button {
      min-height: 180px;
      border: none;
      border-radius: 28px;
      padding: 18px;
      color: white;
      background: linear-gradient(#39b5e8, #0097cf);
      box-shadow: 0 8px 0 #006b93;
      cursor: pointer;
    }

    .difficulty-button.selected {
      background: linear-gradient(#c045b7, #9d168e);
      box-shadow: 0 8px 0 #6f0c66;
    }

    .difficulty-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .difficulty-text {
      font-size: 1.1rem;
      line-height: 1.35;
    }

    .start-button,
    .big-button {
      width: 100%;
      font-size: 2.8rem;
      border: none;
      border-radius: 22px;
      padding: 14px 0;
      color: white;
      background: linear-gradient(#68c64a, #289313);
      box-shadow: 0 7px 0 #17640d;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
      background: rgba(20, 20, 20, 0.78);
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 1.2rem;
      color: #eee;
    }

    .title {
      position: absolute;
      top: 58px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2.4rem;
      font-weight: bold;
      z-index: 20;
      color: rgba(255, 255, 255, 0.92);
    }

    .message {
      position: absolute;
      top: 108px;
      left: 50%;
      transform: translateX(-50%);
      min-height: 42px;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      z-index: 60;
      text-shadow: 0 3px 5px rgba(0, 0, 0, 0.9);
    }

    .message.good {
      color: #58e058;
    }

    .message.bad {
      color: #ff5555;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 190px 1fr 190px;
      align-items: center;
      padding: 120px 22px 40px;
      gap: 18px;
    }

    .pokemon-side {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      position: relative;
      z-index: 10;
    }

    .pokemon {
      width: 175px;
      height: 175px;
      object-fit: contain;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.75));
    }

    .pokemon.left {
      transform: scaleX(-1);
    }

    .pokemon.goal.crash {
      animation: crashPokemon 1.3s ease-in forwards;
    }

    .runner {
      position: absolute;
      width: 72px;
      height: 72px;
      object-fit: contain;
      z-index: 80;
      pointer-events: none;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.8));
      transition: left 0.42s ease, top 0.42s ease, transform 0.25s ease;
      transform: translate(-50%, -50%) scaleX(-1);
    }

    .runner.jump {
      transform: translate(-50%, -58%) scaleX(-1) scale(1.08);
    }

    .board-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .board {
      width: min(100%, 1120px);
      display: grid;
      gap: 18px 30px;
    }

    .cell {
      height: 72px;
      border: none;
      cursor: pointer;
      color: #111;
      font-size: 1.5rem;
      font-weight: bold;
      position: relative;
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.75), rgba(255,255,255,0.25) 38%, rgba(255,255,255,0) 39%),
        linear-gradient(#d8f8ff, #9bddeb 58%, #75cbdc);
      border-radius: 48% 52% 45% 55% / 48% 45% 55% 52%;
      box-shadow:
        inset 0 -9px 0 rgba(43, 159, 180, 0.25),
        inset 0 5px 0 rgba(255,255,255,0.55),
        0 5px 0 #5bb6c9,
        0 9px 12px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 6px 12px auto 12px;
      height: 18px;
      background: rgba(255,255,255,0.32);
      border-radius: 50%;
      pointer-events: none;
    }

    .cell.reachable {
      outline: 4px solid rgba(255, 216, 77, 0.70);
      outline-offset: 3px;
    }

    .cell.correct {
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.45), rgba(255,255,255,0.08) 38%, rgba(255,255,255,0) 39%),
        linear-gradient(#8ee878, #43ba34 58%, #238c18);
      box-shadow:
        inset 0 -9px 0 rgba(0, 80, 0, 0.22),
        inset 0 5px 0 rgba(255,255,255,0.35),
        0 5px 0 #17640d,
        0 9px 12px rgba(0,0,0,0.35);
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      animation: goodStep 0.35s;
    }

    .cell.wrong {
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.45), rgba(255,255,255,0.08) 38%, rgba(255,255,255,0) 39%),
        linear-gradient(#ff8a8a, #e63636 58%, #a80e0e);
      box-shadow:
        inset 0 -9px 0 rgba(80, 0, 0, 0.22),
        inset 0 5px 0 rgba(255,255,255,0.35),
        0 5px 0 #6f0c0c,
        0 9px 12px rgba(0,0,0,0.35);
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      animation: wrongShake 0.35s;
    }

    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      z-index: 100;
      pointer-events: none;
      animation: firework 1s ease-out forwards;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
    }

    .overlay.visible {
      display: flex;
    }

    .result-box {
      width: min(680px, calc(100vw - 36px));
      background: #1d1d1d;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 8px 0 #000;
      text-align: center;
    }

    .result-box h1 {
      font-size: 3.4rem;
      margin: 0 0 16px;
    }

    .result-box p {
      font-size: 1.8rem;
      margin: 12px 0 24px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @keyframes goodStep {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes wrongShake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
      100% { transform: translateX(0); }
    }

    @keyframes crashPokemon {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(160deg);
        opacity: 0;
      }
    }

    @keyframes firework {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0.2);
        opacity: 0;
      }
    }

    @media (max-height: 720px) {
      .setup {
        margin: 10px auto;
        padding: 18px;
      }

      .setup h1 {
        font-size: 2.8rem;
      }

      .setup p {
        font-size: 1.1rem;
        margin-bottom: 14px;
      }

      .difficulty-grid {
        gap: 12px;
        margin: 14px 0;
      }

      .difficulty-button {
        min-height: 132px;
        border-radius: 20px;
        padding: 12px;
      }

      .difficulty-title {
        font-size: 1.8rem;
      }

      .difficulty-text {
        font-size: 0.9rem;
      }

      .title {
        top: 48px;
        font-size: 1.8rem;
      }

      .message {
        top: 82px;
        font-size: 1.45rem;
      }

      .small-button {
        font-size: 0.9rem;
        padding: 6px 12px;
      }

      .stats {
        font-size: 0.95rem;
        padding: 6px 10px;
        gap: 12px;
      }

      .scene {
        grid-template-columns: 135px 1fr 135px;
        padding: 92px 16px 24px;
        gap: 10px;
      }

      .pokemon {
        width: 128px;
        height: 128px;
      }

      .runner {
        width: 54px;
        height: 54px;
      }

      .board {
        gap: 10px 18px;
      }

      .cell {
        height: 54px;
        font-size: 1.15rem;
      }

      .result-box h1 {
        font-size: 2.6rem;
      }

      .result-box p {
        font-size: 1.4rem;
      }

      .big-button {
        font-size: 1.8rem;
        padding: 10px 0;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <section id="setupScreen" class="setup">
      <div class="topbar">
        <a class="small-button orange" href="index.html">Zurück</a>
        <button class="small-button" onclick="goFullscreen()">Vollbild</button>
      </div>

      <h1>Eis-Pfad</h1>
      <p>Finde den einzigen richtigen Weg über die Eisschollen.</p>

      <div class="difficulty-grid">
        <button id="easyButton" class="difficulty-button" onclick="selectDifficulty('easy')">
          <div class="difficulty-title">Leicht</div>
          <div class="difficulty-text">Kürzere Wege, mehr Versuche, einfachere Aufgaben</div>
        </button>

        <button id="mediumButton" class="difficulty-button selected" onclick="selectDifficulty('medium')">
          <div class="difficulty-title">Mittel</div>
          <div class="difficulty-text">Gemischte Wege, 3 Versuche, normale Aufgaben</div>
        </button>

        <button id="hardButton" class="difficulty-button" onclick="selectDifficulty('hard')">
          <div class="difficulty-title">Schwer</div>
          <div class="difficulty-text">Längere Wege, weniger Versuche, schwerere Aufgaben</div>
        </button>
      </div>

      <button class="start-button" onclick="startGame()">Start</button>
    </section>

    <section id="gameScreen" class="hidden">
      <div class="game-topbar">
        <button class="small-button orange" onclick="showSetup()">Zurück</button>

        <div class="stats">
          <div id="difficultyDisplay">Mittel</div>
          <div id="triesDisplay">Versuche: 3</div>
          <div id="stepDisplay">Schritte: 0</div>
        </div>

        <button class="small-button" onclick="goFullscreen()">Vollbild</button>
      </div>

      <div class="title">Eis-Pfad</div>
      <div id="message" class="message"></div>

      <div class="scene">
        <div class="pokemon-side">
          <img id="leftPokemon" class="pokemon left" src="" alt="Start-Pokémon">
        </div>

        <div class="board-wrap">
          <div id="board" class="board"></div>
        </div>

        <div class="pokemon-side">
          <img id="rightPokemon" class="pokemon goal" src="" alt="Ziel-Pokémon">
        </div>
      </div>

      <img id="runnerPokemon" class="runner hidden" src="" alt="Laufendes Pokémon">
    </section>

    <div id="overlay" class="overlay">
      <div class="result-box">
        <h1 id="resultTitle">Gewonnen!</h1>
        <p id="resultText">Du hast den Eis-Pfad geschafft.</p>

        <div class="result-actions">
          <button class="big-button" onclick="startGame()">Nochmal</button>
          <button class="big-button" onclick="showSetup()">Einstellungen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLLECTION_STORAGE_KEY = "pokemonCollection";
    const NUMBER_OF_POKEMON = 1025;

    const DIFFICULTIES = {
      easy: {
        label: "Leicht",
        rows: 5,
        cols: 5,
        tries: 5,
        pathMin: 5,
        pathMax: 9,
        plusMax: 10,
        minusMax: 20
      },
      medium: {
        label: "Mittel",
        rows: 6,
        cols: 6,
        tries: 3,
        pathMin: 7,
        pathMax: 13,
        plusMax: 20,
        minusMax: 40
      },
      hard: {
        label: "Schwer",
        rows: 7,
        cols: 6,
        tries: 3,
        pathMin: 10,
        pathMax: 18,
        plusMax: 30,
        minusMax: 60
      }
    };

    let selectedDifficulty = "medium";
    let config = DIFFICULTIES[selectedDifficulty];

    let rows = config.rows;
    let cols = config.cols;
    let triesLeft = config.tries;

    let currentRow = 0;
    let currentCol = -1;
    let startRow = 0;
    let goalRow = 0;
    let pathCells = [];
    let gameOver = false;
    let steps = 0;

    let leftPokemonNumber = 1;
    let rightPokemonNumber = 7;

    function selectDifficulty(difficulty) {
      selectedDifficulty = difficulty;
      config = DIFFICULTIES[selectedDifficulty];

      document.getElementById("easyButton").classList.remove("selected");
      document.getElementById("mediumButton").classList.remove("selected");
      document.getElementById("hardButton").classList.remove("selected");

      if (difficulty === "easy") {
        document.getElementById("easyButton").classList.add("selected");
      } else if (difficulty === "medium") {
        document.getElementById("mediumButton").classList.add("selected");
      } else {
        document.getElementById("hardButton").classList.add("selected");
      }
    }

    function startGame() {
      config = DIFFICULTIES[selectedDifficulty];
      rows = config.rows;
      cols = config.cols;
      triesLeft = config.tries;

      currentRow = 0;
      currentCol = -1;
      startRow = 0;
      goalRow = 0;
      pathCells = [];
      gameOver = false;
      steps = 0;

      document.getElementById("setupScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("overlay").classList.remove("visible");
      document.getElementById("rightPokemon").classList.remove("crash");
      document.getElementById("runnerPokemon").classList.add("hidden");

      setRandomPokemonImages();
      generatePath();
      buildBoard();
      updateStats();
      showMessage("Finde den richtigen Eis-Pfad!", "");
      updateReachableCells();
    }

    function showSetup() {
      gameOver = true;

      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("overlay").classList.remove("visible");
      document.getElementById("setupScreen").classList.remove("hidden");
      document.getElementById("runnerPokemon").classList.add("hidden");
    }

    function setRandomPokemonImages() {
      leftPokemonNumber = randomNumber(1, NUMBER_OF_POKEMON);
      rightPokemonNumber = randomNumber(1, NUMBER_OF_POKEMON);

      while (rightPokemonNumber === leftPokemonNumber) {
        rightPokemonNumber = randomNumber(1, NUMBER_OF_POKEMON);
      }

      const leftUrl = getPokemonImageUrl(leftPokemonNumber);
      const rightUrl = getPokemonImageUrl(rightPokemonNumber);

      document.getElementById("leftPokemon").src = leftUrl;
      document.getElementById("rightPokemon").src = rightUrl;

      const runner = document.getElementById("runnerPokemon");
      runner.src = leftUrl;
    }

    function generatePath() {
      const targetLength = randomNumber(config.pathMin, config.pathMax);
      const maxLength = Math.min(rows * cols, targetLength + randomNumber(0, 4));
      const maxAttempts = 2500;

      let bestPath = null;
      let bestStartRow = 0;
      let bestGoalRow = 0;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const candidateStartRow = randomNumber(0, rows - 1);

        pathCells = [
          { row: candidateStartRow, col: 0 }
        ];

        const candidatePath = searchPath(candidateStartRow, 0, targetLength, maxLength);

        if (candidatePath && (!bestPath || scorePath(candidatePath, targetLength) > scorePath(bestPath, targetLength))) {
          bestPath = candidatePath;
          bestStartRow = candidateStartRow;
          bestGoalRow = candidatePath[candidatePath.length - 1].row;
        }

        if (bestPath && bestPath.length >= targetLength) {
          break;
        }
      }

      if (bestPath) {
        pathCells = bestPath;
        startRow = bestStartRow;
        goalRow = bestGoalRow;
        currentRow = startRow;
        currentCol = -1;
      } else {
        createFallbackPath();
      }
    }

    function scorePath(path, targetLength) {
      const lengthScore = 100 - Math.abs(path.length - targetLength);
      const verticalMoves = countVerticalMoves(path);
      const backMoves = countBackMoves(path);

      return lengthScore + verticalMoves * 3 + backMoves * 2;
    }

    function countVerticalMoves(path) {
      let count = 0;

      for (let i = 1; i < path.length; i++) {
        if (path[i].row !== path[i - 1].row) {
          count++;
        }
      }

      return count;
    }

    function countBackMoves(path) {
      let count = 0;

      for (let i = 1; i < path.length; i++) {
        if (path[i].col < path[i - 1].col) {
          count++;
        }
      }

      return count;
    }

    function searchPath(row, col, targetLength, maxLength) {
      if (pathCells.length > maxLength) {
        return null;
      }

      if (col === cols - 1) {
        if (pathCells.length >= targetLength) {
          return pathCells.slice();
        }

        return null;
      }

      const candidates = getMoveCandidates(row, col);

      for (const candidate of candidates) {
        if (
          candidate.col === cols - 1 &&
          pathCells.length + 1 < targetLength
        ) {
          continue;
        }

        if (canAddPathCell(candidate.row, candidate.col, row, col)) {
          pathCells.push({
            row: candidate.row,
            col: candidate.col
          });

          const result = searchPath(candidate.row, candidate.col, targetLength, maxLength);

          if (result) {
            return result;
          }

          pathCells.pop();
        }
      }

      return null;
    }

    function getMoveCandidates(row, col) {
      let candidates;

      if (col === 0) {
        candidates = [
          { row: row, col: col + 1 }
        ];
      } else {
        const preferStraight = Math.random() < 0.42;

        if (preferStraight) {
          candidates = [
            { row: row, col: col + 1 },
            { row: row - 1, col: col },
            { row: row + 1, col: col },
            { row: row, col: col - 1 }
          ];
        } else {
          candidates = [
            { row: row - 1, col: col },
            { row: row + 1, col: col },
            { row: row, col: col - 1 },
            { row: row, col: col + 1 }
          ];
        }
      }

      return shuffle(candidates);
    }

    function canAddPathCell(row, col, previousRow, previousCol) {
      if (row < 0 || row >= rows || col < 0 || col >= cols) {
        return false;
      }

      if (isPathCell(row, col)) {
        return false;
      }

      // In der ersten Spalte darf nur eine einzige richtige Startscholle liegen.
      if (col === 0) {
        return false;
      }

      const neighbours = [
        { row: row - 1, col: col },
        { row: row + 1, col: col },
        { row: row, col: col - 1 },
        { row: row, col: col + 1 }
      ];

      for (const neighbour of neighbours) {
        const isPrevious =
          neighbour.row === previousRow &&
          neighbour.col === previousCol;

        if (!isPrevious && isPathCell(neighbour.row, neighbour.col)) {
          return false;
        }
      }

      return true;
    }

    function createFallbackPath() {
      pathCells = [];
      startRow = randomNumber(0, rows - 1);
      goalRow = startRow;

      for (let col = 0; col < cols; col++) {
        pathCells.push({ row: startRow, col });
      }

      currentRow = startRow;
      currentCol = -1;
    }

    function isPathCell(row, col) {
      return pathCells.some(cell => cell.row === row && cell.col === col);
    }

    function buildBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      board.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      board.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const cell = document.createElement("button");
          const isCorrectPath = isPathCell(row, col);

          cell.className = "cell";
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.dataset.correct = isCorrectPath ? "true" : "false";

          if (isCorrectPath) {
            cell.textContent = createTrueTaskText();
          } else {
            cell.textContent = createFalseTaskText();
          }

          cell.addEventListener("click", () => handleCellClick(cell));
          board.appendChild(cell);
        }
      }
    }

    function handleCellClick(cell) {
      if (gameOver) {
        return;
      }

      const row = Number(cell.dataset.row);
      const col = Number(cell.dataset.col);

      if (!isReachable(row, col)) {
        return;
      }

      if (cell.classList.contains("correct")) {
        return;
      }

      const isCorrect = cell.dataset.correct === "true";

      if (isCorrect) {
        cell.classList.add("correct");
        currentRow = row;
        currentCol = col;
        steps++;

        moveRunnerToCell(cell);

        showMessage("Richtig!", "good");
        updateStats();

        if (col === cols - 1 && row === goalRow) {
          winGame();
          return;
        }

        updateReachableCells();
      } else {
        if (!cell.classList.contains("wrong")) {
          triesLeft--;
          cell.classList.add("wrong");
        }

        showMessage("Falsche Scholle!", "bad");
        updateStats();

        if (triesLeft <= 0) {
          loseGame();
          return;
        }

        updateReachableCells();
      }
    }

    function moveRunnerToCell(cell) {
      const runner = document.getElementById("runnerPokemon");
      const rect = cell.getBoundingClientRect();

      runner.classList.remove("hidden");
      runner.style.left = (rect.left + rect.width / 2) + "px";
      runner.style.top = (rect.top + rect.height / 2) + "px";

      runner.classList.add("jump");

      setTimeout(() => {
        runner.classList.remove("jump");
      }, 260);
    }

    function isReachable(row, col) {
      if (currentCol === -1) {
        return col === 0;
      }

      const distance =
        Math.abs(row - currentRow) +
        Math.abs(col - currentCol);

      return distance === 1;
    }

    function updateReachableCells() {
      const cells = document.querySelectorAll(".cell");

      cells.forEach(cell => {
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);

        cell.classList.remove("reachable");

        if (
          !gameOver &&
          isReachable(row, col) &&
          !cell.classList.contains("correct") &&
          !cell.classList.contains("wrong")
        ) {
          cell.classList.add("reachable");
        }
      });
    }

    function winGame() {
      gameOver = true;
      updateReachableCells();

      savePokemonToCollection(rightPokemonNumber);

      showMessage("Geschafft! 🎉", "good");
      launchFireworks();

      setTimeout(() => {
        document.getElementById("resultTitle").textContent = "Gewonnen! 🎉";
        document.getElementById("resultText").textContent =
          "Du hast den Eis-Pfad geschafft. Das Ziel-Pokémon wurde gesammelt!";
        document.getElementById("overlay").classList.add("visible");
      }, 1400);
    }

    function loseGame() {
      gameOver = true;
      updateReachableCells();

      showMessage("Keine Versuche mehr!", "bad");
      document.getElementById("rightPokemon").classList.add("crash");

      setTimeout(() => {
        document.getElementById("resultTitle").textContent = "Verloren";
        document.getElementById("resultText").textContent =
          "Das Ziel-Pokémon ist abgestürzt. Versuch es noch einmal!";
        document.getElementById("overlay").classList.add("visible");
      }, 1300);
    }

    function createTrueTaskText() {
      const usePlus = Math.random() < 0.5;

      if (usePlus) {
        const a = randomNumber(1, config.plusMax);
        const b = randomNumber(1, config.plusMax);
        return a + " + " + b + " = " + (a + b);
      }

      const a = randomNumber(1, config.minusMax);
      const b = randomNumber(0, a);
      return a + " - " + b + " = " + (a - b);
    }

    function createFalseTaskText() {
      const usePlus = Math.random() < 0.5;

      let a;
      let b;
      let correct;
      let shown;

      if (usePlus) {
        a = randomNumber(1, config.plusMax);
        b = randomNumber(1, config.plusMax);
        correct = a + b;
      } else {
        a = randomNumber(1, config.minusMax);
        b = randomNumber(0, a);
        correct = a - b;
      }

      do {
        shown = correct + randomNumber(-5, 5);
      } while (shown === correct || shown < 0);

      if (usePlus) {
        return a + " + " + b + " = " + shown;
      }

      return a + " - " + b + " = " + shown;
    }

    function updateStats() {
      document.getElementById("difficultyDisplay").textContent = config.label;

      document.getElementById("triesDisplay").textContent =
        "Versuche: " + triesLeft;

      document.getElementById("stepDisplay").textContent =
        "Schritte: " + steps;
    }

    function showMessage(text, type) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = "message";

      if (type) {
        message.classList.add(type);
      }

      clearTimeout(showMessage.timeoutId);
      showMessage.timeoutId = setTimeout(() => {
        if (!gameOver) {
          message.textContent = "";
          message.className = "message";
        }
      }, 1200);
    }

    function launchFireworks() {
      for (let burst = 0; burst < 7; burst++) {
        setTimeout(() => {
          createFireworkBurst(
            randomNumber(220, window.innerWidth - 220),
            randomNumber(120, window.innerHeight - 180)
          );
        }, burst * 180);
      }
    }

    function createFireworkBurst(x, y) {
      const colors = ["#ff5555", "#ffd84d", "#58e058", "#39b5e8", "#c045b7", "#ffffff"];

      for (let i = 0; i < 30; i++) {
        const spark = document.createElement("div");
        spark.className = "firework";

        const angle = (Math.PI * 2 * i) / 30;
        const distance = randomNumber(70, 160);

        spark.style.left = x + "px";
        spark.style.top = y + "px";
        spark.style.background = colors[randomNumber(0, colors.length - 1)];
        spark.style.setProperty("--dx", Math.cos(angle) * distance + "px");
        spark.style.setProperty("--dy", Math.sin(angle) * distance + "px");

        document.querySelector(".app").appendChild(spark);

        setTimeout(() => {
          spark.remove();
        }, 1100);
      }
    }

    function padPokemonNumber(pokemonNumber) {
      return String(pokemonNumber).padStart(3, "0");
    }

    function getPokemonImageUrl(pokemonNumber) {
      return "https://db.pokemongohub.net/images/official/full/" +
        padPokemonNumber(pokemonNumber) +
        ".webp";
    }

    function getPokemonCollection() {
      const saved = localStorage.getItem(COLLECTION_STORAGE_KEY);

      if (!saved) {
        return [];
      }

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          return parsed
            .map(Number)
            .filter(number => Number.isInteger(number) && number >= 1 && number <= NUMBER_OF_POKEMON);
        }

        return [];
      } catch {
        return [];
      }
    }

    function savePokemonToCollection(pokemonNumber) {
      const collection = getPokemonCollection();

      if (!collection.includes(pokemonNumber)) {
        collection.push(pokemonNumber);
        collection.sort((a, b) => a - b);
        localStorage.setItem(COLLECTION_STORAGE_KEY, JSON.stringify(collection));
      }
    }

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = randomNumber(0, i);
        const temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }

      return array;
    }

    function goFullscreen() {
      const element = document.documentElement;

      if (element.requestFullscreen) {
        element.requestFullscreen();
      } else if (element.webkitRequestFullscreen) {
        element.webkitRequestFullscreen();
      }
    }
  </script>
